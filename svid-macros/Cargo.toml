[package]
name = "svid-macros"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Proc-macro derives for the svid crate"
repository = "https://github.com/storyvis/svid"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
heck = "0.5"
