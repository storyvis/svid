[workspace]
members = [".", "svid-macros"]

[package]
name = "svid"
version = "0.5.3"
edition = "2024"
description = "Stateless Verifiable ID — native + WASM 64-bit ID generator"
license = "Apache-2.0"
authors = ["lavajnv@gmail.com (Lava Bokam)"]
repository = "https://github.com/storyvis/svid"
homepage = "https://github.com/storyvis/svid"
documentation = "https://docs.rs/svid"
readme = "README.md"
keywords = ["id", "uuid", "snowflake", "wasm", "identifier"]
categories = ["data-structures", "wasm", "encoding"]

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = "0.9"
bs58 = "0.5"
svid-macros = { path = "svid-macros", version = "0.5.3" }
serde = { version = "1", features = ["derive"], optional = true }
strum = { version = "0.27", features = ["derive"], optional = true }
diesel = { version = "2", features = ["postgres"], optional = true }
ts-rs = { version = "10", optional = true }
autosurgeon = { version = "0.11", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
automerge = "0.7"

[features]
default = ["bits-balanced"]

# Bit-layout profiles. Exactly one must be enabled.
# Layout: [sign 1b][timestamp T][random M][source 1b][tag 7b] where T + M = 55.
bits-long-life = []   # 31 ts (~68 yr) + 24 rand — original timestamp range, lowest collision resistance
bits-balanced  = []   # 29 ts (~17 yr) + 26 rand — recommended default
bits-high-rand = []   # 28 ts (~8.5 yr) + 27 rand — short-lived data, highest collision resistance

serde = ["dep:serde"]
strum = ["dep:strum"]
diesel = ["dep:diesel"]
ts = ["dep:ts-rs"]
autosurgeon = ["dep:autosurgeon"]

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-mutable-globals",
    "--enable-reference-types",
    "--enable-multivalue",
]
