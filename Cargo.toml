[workspace]
members = [".", "svid-macros"]

[package]
name = "svid"
version = "0.6.0"
edition = "2024"
description = "Stateless Verifiable ID — native + WASM typed 64-bit and 128-bit IDs"
license = "Apache-2.0"
authors = ["lavajnv@gmail.com (Lava Bokam)"]
repository = "https://github.com/storyvis/svid"
homepage = "https://github.com/storyvis/svid"
documentation = "https://docs.rs/svid"
readme = "README.md"
keywords = ["id", "uuid", "snowflake", "wasm", "identifier"]
categories = ["data-structures", "wasm", "encoding"]

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = "0.9"
bs58 = "0.5"
svid-macros = { path = "svid-macros", version = "0.6.0" }
serde = { version = "1", features = ["derive"], optional = true }
strum = { version = "0.27", features = ["derive"], optional = true }
diesel = { version = "2", features = ["postgres"], optional = true }
ts-rs = { version = "10", optional = true }
autosurgeon = { version = "0.11", optional = true }
http = { version = "1", optional = true }
postgres-types = { version = "0.2", optional = true }
bytes = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
automerge = "0.8"
serde_json = "1"

[features]
default = ["bits-long-life"]

# Bit-layout profiles. Exactly one must be enabled.
# Layout: [sign 1b][timestamp T][random M][source 1b][tag 12b] where T + M = 50.
bits-long-life = []   # 31 ts (~68 yr) + 19 rand — default
bits-balanced  = []   # 29 ts (~17 yr) + 21 rand
bits-high-rand = []   # 28 ts (~8.5 yr) + 22 rand

serde = ["dep:serde"]
strum = ["dep:strum"]
diesel = ["dep:diesel"]
ts = ["dep:ts-rs"]
autosurgeon = ["dep:autosurgeon"]
# Make SvidGenerator::generate (and mint/registries/wasm generateSvid) monotonic.
monotonic = []
# From/TryFrom conversions with http::HeaderValue.
http = ["dep:http"]
postgres = ["dep:postgres-types", "dep:bytes"]

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-mutable-globals",
    "--enable-reference-types",
    "--enable-multivalue",
]
